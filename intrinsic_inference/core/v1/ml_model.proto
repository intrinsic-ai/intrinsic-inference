syntax = "proto3";

package inference.v1;

import "google/protobuf/any.proto";

// The ModelConfig message provides a unified, backend-agnostic configuration
// based on the Open Inference Protocol ModelMetadataResponse.
message MlModelConfig {
  // Metadata for a tensor.
  message TensorMetadata {
    // The tensor name.
    string name = 1;

    // The tensor data type.
    // MUST conform to the Open Inference Protocol data type strings
    // (e.g., "BOOL", "UINT8", "INT32", "FP16", "FP32", "BYTES").
    string datatype = 2;

    // The tensor shape. A variable-size dimension is represented
    // by a -1 value.
    repeated int64 shape = 3;
  }

  // The model name.
  string name = 1;

  // The version of the model.
  string version = 2;

  // The model's inputs.
  repeated TensorMetadata inputs = 3;

  // The model's outputs.
  repeated TensorMetadata outputs = 4;
}

// A MlModel packages the model config and necessary file references
// in a single message and should contain all information needed to
// execute the model.
message MlModel {
  // Message storing model data or references to a storage location it can be
  // obtained from.
  message MlModelData {
    oneof data {
      // A standard URI reference to data stored externally.
      // Expected formats include "s3://...", "gs://...", or "file://...".
      string reference = 1;
    }
  }

  // The platform-agnostic configuration of the model.
  MlModelConfig model_config = 1;

  // Backend-specific configuration.
  // By using an Any field we enable easy extension of the service with
  // support for different inference backends (e.g., Triton, ONNX, vLLM).
  google.protobuf.Any backend_config = 2;

  // Maps a relative destination file path to its remote data reference.
  // Sanitize the key to prevent directory traversal attacks (via "../").
  // Example valid key: "1/model.savedmodel/saved_model.pb".
  map<string, MlModelData> model_data = 3;
}
